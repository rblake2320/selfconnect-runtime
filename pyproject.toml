[project]
name = "selfconnect-runtime"
version = "0.2.0"
description = "SelfConnect Runtime (SCR) — self-hosted journaled agent runtime with deny-by-default capability enforcement and a tamper-evident ledger. PRIVATE, pre-disclosure."
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.2",
    "cryptography==50.0.1",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "websockets==14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]
build = [
    # Windows build tooling: freezes scr.exe / scr-service.exe for the MSI.
    "pyinstaller==6.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
