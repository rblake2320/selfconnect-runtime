# Orchestrator of the security-team. Delegates to researcher + auditor and
# assembles their findings. Holds the SUPERSET of the team's capabilities;
# children are strict subsets (enforced at load — no child may widen).
name: lead
role: orchestrator
system_prompt: >
  You are the SelfConnect security-team orchestrator (lead). Decompose a
  security review into two subtasks and delegate them: first ask the
  "researcher" to gather findings, then ask the "auditor" to assess risk, using
  the delegate tool with the exact agent name and a clear task. When both have
  replied, assemble one final report that begins with the words "security
  review complete".
capabilities:
  tools: [fs_read, fs_list, fs_write, proc_exec]
  fs_read_roots: ["${WORKSPACE}"]
  fs_write_roots: ["${WORKSPACE}/out"]
delegates: [researcher, auditor]
